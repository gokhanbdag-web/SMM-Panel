name: PHP checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Lint all PHP files
        run: |
          set -e
          find . -type f -name '*.php' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
